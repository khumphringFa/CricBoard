name: Test CricBoard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check cloud.mjs && node --check account.mjs && node --check worker.mjs
      - run: node --test engine.test.mjs cloud.test.mjs worker.test.mjs
