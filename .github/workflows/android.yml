name: CricBoard Android
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', '*.mjs', '*.js', '*.html', '*.css']
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
      - name: Bundle scoring dependencies
        run: npm install --prefix android --no-save --ignore-scripts peerjs@1.5.5
      - name: Verify Android SDK
        run: |
          sdkmanager --version
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - run: gradle -p android :app:assembleDebug :app:lintDebug
  signed:
    needs: debug
    outputs:
      version: ${{ steps.version.outputs.version }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify trusted release source
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Resolve app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F "'" '/^[[:space:]]*versionName / {print $2}' android/app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
      - name: Bundle scoring dependencies
        run: npm install --prefix android --no-save --ignore-scripts peerjs@1.5.5
      - name: Verify Android SDK
        run: |
          sdkmanager --version
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Build signed APK and AAB
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing repository secret: $name"; exit 1; fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/cricboard-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle -p android :app:assembleRelease :app:bundleRelease
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/CricBoard-v$APP_VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/CricBoard-v$APP_VERSION.aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "release/CricBoard-v$APP_VERSION.apk"
          jarsigner -verify "release/CricBoard-v$APP_VERSION.aab"
          (cd release && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: CricBoard-v${{ steps.version.outputs.version }}-signed
          path: release/
          if-no-files-found: error
  publish-release:
    needs: signed
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CricBoard-v${{ needs.signed.outputs.version }}-signed
          path: release
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.signed.outputs.version }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          tag="v$APP_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version already published; keeping existing release intact."
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CricBoard $tag" --notes "Signed Android APK. Device testing recommended before promoting to stable." --prerelease
          fi
