plugins { id 'com.android.application' }
android {
    namespace 'com.khumphringfa.cricboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.khumphringfa.cricboard'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                storeType 'JKS'
            }
        }
    }
    buildTypes {
        release {
            if (signingPath) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.browser:browser:1.8.0' }
