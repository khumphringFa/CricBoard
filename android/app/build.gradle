plugins { id 'com.android.application' }
android {
    namespace 'com.khumphringfa.cricboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.khumphringfa.cricboard'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                storeType 'JKS'
            }
        }
    }
    buildTypes {
        release {
            if (signingPath) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
def bundled = layout.buildDirectory.dir('generated/cricboardAssets')
tasks.register('bundleCricBoard', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'styles.css', 'public.css', 'favicon.svg', 'app.js', 'account.mjs', 'engine.mjs', 'cloud.mjs', 'central.mjs', 'portal.mjs', 'public-data.mjs'
        filter { line -> line.replace('https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js','peerjs.min.js').replace('<script type="module" src="account.mjs"></script>','<script defer src="native.js"></script><script type="module" src="account.mjs"></script>') }
    }
    from(rootProject.file('node_modules/peerjs/dist/peerjs.min.js'))
    into(bundled)
    doLast { if (!file("${bundled.get().asFile}/peerjs.min.js").exists()) throw new GradleException('Run npm install --prefix android --no-save peerjs@1.5.5 before the build') }
}
android.sourceSets.main.assets.srcDir(bundled)
tasks.named('preBuild').configure { dependsOn('bundleCricBoard') }

